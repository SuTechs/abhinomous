# Supabase pauses free projects that see no activity for a while.
# This pings the database twice a week so the site never goes to sleep.
# Needs two repository secrets: VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets not set — skipping."
            exit 0
          fi
          curl --fail --silent --show-error "$SUPABASE_URL/rest/v1/site_settings?select=id&limit=1" -H "apikey: $SUPABASE_KEY" > /dev/null
          echo "Supabase is awake."
